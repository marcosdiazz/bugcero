name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde GitHub si lo deseas

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer consulta a la API de Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
